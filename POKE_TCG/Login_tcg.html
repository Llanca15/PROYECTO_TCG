<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/loginc.css">
</head>

<body>
    <header>
        <img src="image/Pokémon_Trading_Card_Game_logo_logo.svg.webp" width="400" height="200" alt="Logo de pokemon"
            style="display: block; margin-left: auto; margin-right: auto;">
        <nav class="menu">
            <a href="pokemon_tcg.html">  INICIO  </a>
            <a href="productos_tcg.html">  PRODUCTOS  </a>
            <a href="contacto_tcg.html">  CONTACTO  </a>
            <a href="Login_tcg.html">  INICIAR SESIÓN  </a>

    <!-- Espacio para el usuario (inicialmente oculto) -->
            <span id="user-info" style="color: white; margin-left: 15px; display: none;">
        👤          <strong id="nombre-usuario"></strong> 
                <button onclick="cerrarSesion()" class="btn btn-sm btn-outline-light ms-2" style="font-size: 12px; padding: 2px 6px;">Salir</button>
            </span>
        </nav>
    </header>
    <form class="bg-white p-4 rounded shadow-sm mx-auto border border-danger" action="#" method="post">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="nombre" class="form-label">Nombre Completo</label><br>
                <input class="form-control" type="text" id="nombre" name="nombre" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="correo">Correo Electrónico</label><br>
                <input class="form-control" type="email" id="correo" name="correo" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="contrasena">Contraseña</label><br>
                <input class="form-control" type="password" id="contrasena" name="contrasena" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="confirmar_contrasena">Confirmar Contraseña</label><br>
                <input class="form-control" type="password" id="confirmar_contrasena" name="confirmar_contrasena"
                    required>
            </div>
            <div class="d-flex justify-content-end mx-3">
                <button id="confirmar" class="btn btn-danger btn-lg" type="submit">Confirmar</button>
            </div>

            <script>
                document.getElementById("confirmar").addEventListener("click", (e) => {
                    e.preventDefault();

                    const correo = document.getElementById("correo").value;
                    const nombre = document.getElementById("nombre").value;
                    const contrasena = document.getElementById("contrasena").value;

                    // Guardamos los datos en el localStorage
                    localStorage.setItem("usuario_activo", nombre || correo);

                    if (correo === "admin@tcg.cl" && contrasena === "tcgchampion") {
                        window.location.href = "admin_tcg.html";
                    } else {
                        window.location.href = "pokemon_tcg.html";
                    }
                });
            </script>
        </div>
    </form>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const usuarioActivo = localStorage.getItem('usuario_activo');
            const linkLogin = document.getElementById('link-login');
            const userInfo = document.getElementById('user-info');
            const nombreUsuario = document.getElementById('nombre-usuario');

            if (usuarioActivo) {
                // Si el usuario ha iniciado sesión: ocultamos el login y mostramos su nombre
                if (linkLogin) linkLogin.style.display = 'none';
                if (userInfo && nombreUsuario) {
                    nombreUsuario.textContent = usuarioActivo;
                    userInfo.style.display = 'inline-block';
                }
            } else {
                // Si NO hay sesión activa (o se acaba de cerrar): mostramos el login y ocultamos el usuario
                if (linkLogin) linkLogin.style.display = 'inline-block';
                if (userInfo) userInfo.style.display = 'none';
            }
        });

        // Función para cerrar sesión
        function cerrarSesion() {
            localStorage.removeItem('usuario_activo');
            window.location.reload(); // Recarga la página para restablecer el menú
        }
    </script>
</body>

<footer class="text-white text-center py-4 mt-5">
    <div class="container">
        <h5>Pobres TCG Store</h5>
        <p>Tu tienda de cartas coleccionables favorita.</p>
        <hr class="border-light">
        <p class="mb-0">&copy; 2026 Pobres TCG Store. Todos los derechos reservados.</p>
    </div>
</footer>

</html>
