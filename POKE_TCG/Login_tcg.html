<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/loginc.css">
</head>

<body>

    <header>
        <img src="image/Pokémon_Trading_Card_Game_logo_logo.svg.webp" width="400" height="200" alt="Logo de pokemon"
            style="display: block; margin-left: auto; margin-right: auto;">
        <nav class="menu">
            <a href="pokemon_tcg.html"> INICIO </a>
            <a href="productos_tcg.html"> PRODUCTOS </a>
            <a href="contacto_tcg.html"> CONTACTO </a>
            <a href="Login_tcg.html"> INICIAR SESIÓN </a>
        </nav>
    </header>
    <form class="bg-white p-4 rounded shadow-sm mx-auto border border-danger" action="#" method="post">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="nombre" class="form-label">Nombre Completo</label><br>
                <input class="form-control" type="text" id="nombre" name="nombre" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="correo">Correo Electrónico</label><br>
                <input class="form-control" type="email" id="correo" name="correo" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="contrasena">Contraseña</label><br>
                <input class="form-control" type="password" id="contrasena" name="contrasena" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="confirmar_contrasena">Confirmar Contraseña</label><br>
                <input class="form-control" type="password" id="confirmar_contrasena" name="confirmar_contrasena"
                    required>
            </div>
            <div class="d-flex justify-content-end mx-3">
                <button id="confirmar" class="btn btn-danger btn-lg" type="submit">Confirmar</button>
            </div>

            <script>
                document.getElementById("confirmar").addEventListener("click", (e) => {
                    e.preventDefault();

                    const correo = document.getElementById("correo").value;
                    const contrasena = document.getElementById("contrasena").value;

                    if (correo === "admin@tcg.cl" && contrasena === "tcgchampion") {
                        window.location.href = "admin_tcg.html";
                    } else {
                        window.location.href = "pokemon_tcg.html";
                    }
                });
            </script>
        </div>
    </form>
</body>

<footer class="text-white text-center py-4 mt-5">
    <div class="container">
        <h5>Pobres TCG Store</h5>
        <p>Tu tienda de cartas coleccionables favorita.</p>
        <hr class="border-light">
        <p class="mb-0">&copy; 2026 Pobres TCG Store. Todos los derechos reservados.</p>
    </div>
</footer>

</html>
